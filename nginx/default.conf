upstream forecastiq_api {
    server backend:8000;
}

# Production HTTPS enforcement: uncomment once certificates are mounted at
# /etc/nginx/certs and set SERVER_NAME. HTTP then only serves the ACME challenge
# and redirects everything else to HTTPS.
#
# server {
#     listen 80;
#     server_name forecastiq.example.com;
#     location /.well-known/acme-challenge/ { root /var/www/certbot; }
#     location / { return 301 https://$host$request_uri; }
# }
#
# server {
#     listen 443 ssl http2;
#     server_name forecastiq.example.com;
#     ssl_certificate     /etc/nginx/certs/fullchain.pem;
#     ssl_certificate_key /etc/nginx/certs/privkey.pem;
#     ssl_protocols TLSv1.2 TLSv1.3;
#     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
#     include /etc/nginx/conf.d/forecastiq-locations.inc;
# }

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://forecastiq_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://forecastiq_api/health;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
